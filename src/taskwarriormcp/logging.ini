[loggers]
keys=root,uvicorn,uvicorn_error,uvicorn_access,taskwarriormcp

[handlers]
keys=default

[formatters]
keys=default

[logger_root]
level=INFO
handlers=default

[logger_uvicorn]
level=INFO
handlers=default
propagate=0
qualname=uvicorn

[logger_uvicorn_error]
level=INFO
handlers=default
propagate=0
qualname=uvicorn.error

[logger_uvicorn_access]
level=INFO
handlers=default
propagate=0
qualname=uvicorn.access

[logger_taskwarriormcp]
level=INFO
handlers=default
propagate=0
qualname=taskwarriormcp

[handler_default]
class=StreamHandler
formatter=default
args=(sys.stderr,)

[formatter_default]
format=%(asctime)s - %(name)s - %(levelname)s - %(message)s
datefmt=%Y-%m-%d %H:%M:%S
