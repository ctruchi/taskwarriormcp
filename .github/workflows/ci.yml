name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      run: docker build -t taskwarrior-mcp:test .

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Create config directory
      run: mkdir -p docker/config/taskwarrior

    - name: Create .taskrc configuration
      run: |
        cat > docker/config/taskwarrior/.taskrc << 'EOF'
        data.location=/data/taskwarrior
        news.version=3.4.1
        sync.gcp.bucket=${{ secrets.SYNC_GCP_BUCKET }}
        sync.gcp.credential_path=\/config\/gcp_credential.json
        sync.encryption_secret=${{ secrets.SYNC_ENCRYPTION_SECRET }}
        EOF

    - name: Create GCP credentials
      run: |
        echo '${{ secrets.SYNC_GCP_CREDENTIAL }}' > docker/config/taskwarrior/gcp_credential.json

    - name: Run tests
      env:
        TASK_COMMAND: docker compose -f docker/docker-compose.yml run --rm taskwarrior
      run: |
        pytest src/tests/ -v
